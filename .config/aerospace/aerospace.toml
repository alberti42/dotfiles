# Make all windows float by default
[[on-window-detected]]
check-further-callbacks = true
run = ['layout floating']

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {x}
[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
	ctrl-alt-shift-comma = 'mode service'
    # ctrl-tab = 'mode workspaces'
    # ctrl-shift-tab = 'mode layouts'
    # ctrl-alt-shift-s = 'mode starter'
    ctrl-alt-shift-l = 'mode layouts'
    ctrl-alt-shift-w = 'mode workspaces'
    ctrl-alt-shift-a = '''exec-and-forget osascript -l JavaScript -e '
    	const launchbar = Application("LaunchBar");
    	launchbar.selection = "/Applications/AeroSpace.app";
    	launchbar.activate();'
    '''

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-tab       = ['focus --boundaries-action wrap-around-the-workspace dfs-next',  'mode main']
    alt-shift-tab = ['focus --boundaries-action wrap-around-the-workspace dfs-prev',  'mode main']

	# See: https://nikitabobko.github.io/AeroSpace/commands#focus
    ctrl-alt-shift-left  = ['focus --boundaries-action wrap-around-the-workspace left',  'mode main']
    ctrl-alt-shift-down  = ['focus --boundaries-action wrap-around-the-workspace down',  'mode main']
    ctrl-alt-shift-up    = ['focus --boundaries-action wrap-around-the-workspace up',    'mode main']
    ctrl-alt-shift-right = ['focus --boundaries-action wrap-around-the-workspace right', 'mode main']

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
	ctrl-shift-alt-tab = 'workspace-back-and-forth'
	# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
	# ctrl-shift-alt-cmd-tab = 'move-workspace-to-monitor --wrap-around next'

[mode.starter.binding]
	esc = 'mode main'
	ctrl-alt-shift-comma = 'mode service'
    # ctrl-tab = 'mode workspaces'
    # ctrl-shift-tab = 'mode layouts'
    # ctrl-alt-shift-s = 'mode starter'
    ctrl-alt-shift-l = 'mode layouts'
    ctrl-alt-shift-w = 'mode workspaces'

    # Launch applications; see: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    s = ['exec-and-forget open -b com.sublimetext.4', 'mode main'] # Sublime
    c = ['exec-and-forget open -b com.busymac.busycal3', 'mode main'] # BusyCal
	f = ['exec-and-forget open -b com.apple.finder', 'mode main'] # Finder
	b = ['exec-and-forget open -b org.mozilla.firefox', 'mode main'] # Firefox 
    k = ['exec-and-forget open -b com.reinvented.KeepIt', 'mode main'] # Keep It
    m = ['exec-and-forget open -b com.freron.MailMate', 'mode main'] # Mailmate
    e = ['exec-and-forget open -b im.riot.app', 'mode main'] # Element
    n = ['exec-and-forget open -b com.apple.MobileSMS', 'mode main'] # Nachrichten
    o = ['exec-and-forget open -b md.obsidian', 'mode main'] # Obsidian
    t = ["exec-and-forget open -b com.github.wez.wezterm", 'mode main'] # WezTerm
    z = ["exec-and-forget open -b us.zoom.xos", 'mode main'] # Zoom

[mode.workspaces.binding]
    esc = 'mode main'
	# ctrll-alt-shift-comma = 'mode service'
    # ctrl-tab = 'mode workspaces'
    # ctrl-shift-tab = 'mode layouts'
    # ctrl-alt-shift-s = 'mode starter'
    # ctrl-alt-shift-l = 'mode layouts'
    # ctrl-alt-shift-w = 'mode workspaces'

    # Full screen mode
    f = ['fullscreen', 'mode main']
    slash = ['layout floating tiling', 'mode main']

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    left  = ['move left',  'mode main']
    down  = ['move down',  'mode main']
    up    = ['move up',    'mode main']
    right = ['move right', 'mode main']

    ctrl-alt-shift-left = ['join-with left', 'mode main']
    ctrl-alt-shift-down = ['join-with down', 'mode main']
    ctrl-alt-shift-up = ['join-with up', 'mode main']
    ctrl-alt-shift-right = ['join-with right', 'mode main']

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    keypadMinus = 'resize smart -25'
    keypadPlus = 'resize smart +25'

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    backslash =  ['layout tiling', 'layout tiles horizontal', 'mode main']
    ctrl-alt-shift-backslash = ['layout tiling', 'layout accordion horizontal', 'mode main']
    minus =  ['layout tiling', 'layout tiles vertical', 'mode main']
    ctrl-alt-shift-minus =  ['layout tiling', 'layout accordion vertical', 'mode main']
    equal =  ['layout floating', 'mode main']
    ctrl-alt-shift-equal =  ['layout tiling', 'mode main']
    
    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    1 = ['workspace 1', 'mode main']
    2 = ['workspace 2', 'mode main']
    3 = ['workspace 3', 'mode main']
    4 = ['workspace 4', 'mode main']
    5 = ['workspace 5', 'mode main']
    6 = ['workspace 6', 'mode main']
    7 = ['workspace 7', 'mode main']
    8 = ['workspace 8', 'mode main']
    9 = ['workspace 9', 'mode main']
    0 = ['workspace 0', 'mode main'] # Music
    b = ['workspace b', 'mode main'] # Web browswer
    d = ['workspace d', 'mode main'] # Development
    e = ['workspace e', 'mode main'] # Element
    g = ['workspace g', 'mode main'] # Git
    l = ['workspace l', 'mode main'] # Latex
    p = ['workspace p', 'mode main'] # Pdf reading
    r = ['workspace r', 'mode main'] # References
    z = ['workspace z', 'mode main'] # Zoom
    s = ['workspace s', 'mode main'] # Sublime
	c = ['workspace c', 'mode main'] # BusyCal
	k = ['workspace k', 'mode main'] # Keep It
	m = ['workspace m', 'mode main'] # Mailmate
	n = ['workspace n', 'mode main'] # Nachrichten
	o = ['workspace o', 'mode main'] # Obsidian
	t = ['workspace t', 'mode main'] # WezTerm    

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    ctrl-alt-shift-cmd-1 = ['move-node-to-workspace 1', 'workspace 1', 'mode main']
    ctrl-alt-shift-cmd-2 = ['move-node-to-workspace 2', 'workspace 2', 'mode main']
    ctrl-alt-shift-cmd-3 = ['move-node-to-workspace 3', 'workspace 3', 'mode main']
    ctrl-alt-shift-cmd-4 = ['move-node-to-workspace 4', 'workspace 4', 'mode main']
    ctrl-alt-shift-cmd-5 = ['move-node-to-workspace 5', 'workspace 5', 'mode main']
    ctrl-alt-shift-cmd-6 = ['move-node-to-workspace 6', 'workspace 6', 'mode main']
    ctrl-alt-shift-cmd-7 = ['move-node-to-workspace 7', 'workspace 7', 'mode main']
    ctrl-alt-shift-cmd-8 = ['move-node-to-workspace 8', 'workspace 8', 'mode main']
    ctrl-alt-shift-cmd-9 = ['move-node-to-workspace 9', 'workspace 9', 'mode main']
    ctrl-alt-shift-cmd-0 = ['move-node-to-workspace 0', 'workspace 0', 'mode main']
    ctrl-alt-shift-cmd-l = ['move-node-to-workspace l', 'workspace l', 'mode main']
    ctrl-alt-shift-cmd-k = ['move-node-to-workspace k', 'workspace k', 'mode main']
    ctrl-alt-shift-cmd-t = ['move-node-to-workspace t', 'workspace t', 'mode main']
    ctrl-alt-shift-cmd-o = ['move-node-to-workspace o', 'workspace o', 'mode main']
    ctrl-alt-shift-cmd-m = ['move-node-to-workspace m', 'workspace m', 'mode main']
    ctrl-alt-shift-cmd-n = ['move-node-to-workspace n', 'workspace n', 'mode main']
    ctrl-alt-shift-cmd-w = ['move-node-to-workspace w', 'workspace w', 'mode main']
    ctrl-alt-shift-cmd-d = ['move-node-to-workspace d', 'workspace d', 'mode main']
    ctrl-alt-shift-cmd-g = ['move-node-to-workspace g', 'workspace g', 'mode main']
    ctrl-alt-shift-cmd-p = ['move-node-to-workspace p', 'workspace p', 'mode main']
    ctrl-alt-shift-cmd-r = ['move-node-to-workspace r', 'workspace r', 'mode main']
    ctrl-alt-shift-cmd-s = ['move-node-to-workspace s', 'workspace s', 'mode main']
