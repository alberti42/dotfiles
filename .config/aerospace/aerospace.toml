    ctrl-alt-shift-cmd-z = ['move-node-to-workspace z', 'workspace z', 'mode main']

    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

    backspace = ['flatten-workspace-tree', 'mode main'] # flatten layout

