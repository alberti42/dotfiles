  # Fix problem with margin-scroll in scroll-config-smooth-scroll
  - fix/pixel-scroll-precision-margin:
      # Pin the compare BASE to the branch's fork point, NOT `master`:
      # the GitHub remote `master` lags local, so `master...branch` picks a stale
      # merge-base and sweeps in dozens of unrelated upstream commits. The fork-point
      # SHA is on the branch itself, so the diff is exactly the pixel-scroll commits
      # regardless of where master points. Use `.diff` (net diff), NOT `.patch`: the
      # `.patch` form is a format-patch series, one message per commit, and its hunks
      # stop applying under plain `patch` once commits re-edit each other's lines.
      # url: https://github.com/emacs-mirror/emacs/compare/ab8cf10227346a5705d571ef1fa8ee7e3ae515d8...110bd6492329f50caffd9535436f60757929e0bf.diff
      url: ./fix-pixel-scroll.patch
      sha256: 1d56540bc8571b3667d80e400d1c2763d89e6dfaef7228cde6b731e6d2dc5c19
