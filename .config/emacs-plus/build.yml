  # Fix problem with margin-scroll in scroll-config-smooth-scroll
  - fix/pixel-scroll-precision-margin-settle:
      # Pin the compare BASE to the branch's fork point (== branch~4), NOT `master`:
      # the GitHub remote `master` lags local, so `master...branch` picks a stale
      # merge-base and sweeps in dozens of unrelated upstream commits. The fork-point
      # SHA is on the branch itself, so the diff is exactly the 4 pixel-scroll commits
      # regardless of where master points. Use `.diff` (net diff), NOT `.patch` (a
      # 4-commit format-patch series whose overlapping hunks fail under plain `patch`).
      url: https://github.com/emacs-mirror/emacs/compare/badce2d952db81c91521ddc988a925154370d56a...alberti42:fork-emacs:bug%2364252/pixel-scroll-linear.patch
      sha256: bf7230c1f3802b6dcdd86f9dc8e3a1425bcfdaf9b5942f935441163834735e63
