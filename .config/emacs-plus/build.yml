icon: dragon-plus

patches:
  # emacs-plus baseline patches. NOTE: patches/emacs-32/*.patch are symlinks to
  # ../emacs-31/*.patch, and GitHub raw serves the symlink target text (not the
  # patch) -- so point at the real emacs-31 files. Pinned to a commit SHA so the
  # content (and thus sha256) is frozen.
  - round-undecorated-frame:
      url: https://raw.githubusercontent.com/d12frosted/homebrew-emacs-plus/b7f47101868eeda09ec75251eabb0cce7446abb2/patches/emacs-31/round-undecorated-frame.patch
