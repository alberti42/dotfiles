  # content (and thus sha256) is frozen.
  - round-undecorated-frame:
      url: https://raw.githubusercontent.com/d12frosted/homebrew-emacs-plus/b7f47101868eeda09ec75251eabb0cce7446abb2/patches/emacs-31/round-undecorated-frame.patch
