# Check https://chatgpt.com/c/68bed35f-1398-8331-b035-6d3769fa00b3

# Focus events are requested from the underlying terminal (if supported) and
# passed through to applications running in tmux. Thereby, the running application
# knows when it receives / loses the user focus.
set-option -g focus-events on

# Useful when using "grouped sessions" and multi-monitor setup
set-window-option -g aggressive-resize on

set-option -g allow-passthrough off
set-option -g mode-keys emacs
set-option -g status-keys emacs
set-option -g set-clipboard on
set-option -g mouse on

# Detach from tmux when closing a session
set-option -g detach-on-destroy on

# Set a modern default-terminal for programs running INSIDE tmux
set-option -g default-terminal "tmux-256color"

# Reduce to zero the time between escape (ESC) and the next character to be escaped
set-option -s escape-time 1

# Messages are displayed for 4 seconds
set-option -g display-time 4000

# Set the timeout for repeated keys
set-option -g repeat-time 1500

# Refresh 'status-left' and 'status-right' more often than default 15 second
set-option -g status-interval 5

# Set the actual prefix (hidden: Ctrl-Shift-b cannot directly be triggered)
set -g prefix C-B

# Tell tmux what the OUTER terminal (e.g. WezTerm, Alacritty, kitty) supports.
# Use terminal-features if tmux >= 3.2, else fall back to terminal-overrides.

%if "#{>=:#{version},3.2}"
  # terminal-features (tmux ≥ 3.2):
  #  - RGB       → truecolor (24-bit colour)
  #  - extkeys   → extended key reporting (CSI u sequences, beyond normal function/arrow keys)
  #  - ccolour   → change cursor colour (OSC 12 support)
  #  - usstyle   → underline styles (single, double, curly, etc., OSC 4;58)
  #  - overline  → overline text attribute (CSI 53)
  #  - italics   → italic text attribute (CSI 3)
  #  - cstyle    → change cursor style (DECSCUSR: block, bar, underline)
  set-option -as terminal-features "xterm-256color:RGB,extkeys,ccolour,usstyle,overline,italics,cstyle"
%else
  # terminal-overrides (tmux < 3.2):
  #  - RGB        → truecolor
  #  - extkeys    → extended key reporting
  #  - hyperlinks → OSC 8 hyperlinks
  #  - cstyle     → cursor style changes
  set-option -as terminal-overrides ",xterm-256color:RGB:extkeys:hyperlinks:cstyle"
%endif

# This fixes the corfu positioning because when you switch tmux
# panes and come back, Emacs gets a focus event, which triggers
# a redraw of the corfu popup at the correct cursor position.
# Without it, the popup was left over from wherever it was drawn
# before you switched away — with stale coordinates — and
# Emacs had no signal to recalculate.
set -g focus-events on

# Add OSC 52 clipboard support (helps copying text over SSH).
# Ms → “Media Copy” capability in terminfo.
#   %p1%s = selection type (clipboard / primary / secondary)
#   %p2%s = base64-encoded payload
# This makes tmux aware it can use OSC 52 sequences to write to system clipboards.
set-option -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Keyboard Settings
# Enable support for advanced key reporting (CSI u)
%if "#{>=:#{version},3.2}"
  set-option -g extended-keys on
%endif

# Configure extended key format (tmux >= 3.4 only)
%if "#{>=:#{version},3.4}"
  set-option -w extended-keys-format csi-u
%endif

# History of tmux commands
%if "#{>=:#{version},3.2}"
  set-option -g history-file ~/.tmux_history
%endif

# Increase scrollback buffer size
set-option -g history-limit 100000

# Replace C-b in the root table:
# - when Emacs is focused → route to emacs-prefix table
# - otherwise → normal prefix table
bind-key -T root C-b if -F \
   "#{||:#{==:#{pane_current_command},Emacs},#{==:#{pane_current_command},emacsclient}}" \
   "send-keys C-b" \
   "switch-client -T prefix"

# Scroll up/down by single lines
bind-key    -T copy-mode      WheelUpPane        send-keys -X -N 1 scroll-up
bind-key    -T copy-mode      WheelDownPane      send-keys -X -N 1 scroll-down
bind-key    -T copy-mode      C-p                send-keys -X scroll-up
bind-key    -T copy-mode      C-n                send-keys -X scroll-down
bind-key    -T copy-mode      C-d                send-keys -X halfpage-down
bind-key    -T copy-mode      C-u                send-keys -X halfpage-up

# Popup shell in the current pane's working directory
bind-key    -T prefix         t                  clock-mode
bind-key    -T prefix         C-t                display-popup -E -w 70\% -h 60\% -d "#{pane_current_path}" "$SHELL -l"

# Switch between windows with ctrl-meta+[ and ctrl-meta+]; C-M-[ does not work because pressing C-M-[ produces twice ESCAPE instead of the desired key combination 
# bind-key -n                 C-M-[              previous-window
# bind-key -n                 C-M-]              next-window

# Switch between windows with ctrl+left/right arrows
# bind-key -r                 C-S-Tab           previous-window
# bind-key -r                 C-Tab             next-window

# Move focus to other panes preventing circular rotation
bind-key -T prefix            LEFT                if -F '#{pane_at_left}'  '' 'select-pane -L'
bind-key -T prefix            RIGHT               if -F '#{pane_at_right}'  '' 'select-pane -R'
bind-key -T prefix            UP                  if -F '#{pane_at_top}'  '' 'select-pane -U'
bind-key -T prefix            DOWN                if -F '#{pane_at_bottom}'  '' 'select-pane -D'

# Switch between windows with Ctrl-Meta+Arrows (no prefix)
bind-key -n                   C-M-LEFT           previous-window
bind-key -n                   C-M-RIGHT          next-window

# Change layout by joining panes using Shift-Arrows
# https://stackoverflow.com/a/70024796/4216175
bind-key -r                   S-UP               if -F '#{pane_at_top}'    ''  'move-pane -h -t ".{up-of}"'
bind-key -r                   S-DOWN             if -F '#{pane_at_bottom}' ''  'move-pane -h -t ".{down-of}"'
bind-key -r                   S-LEFT             if -F '#{pane_at_left}'   ''  'move-pane -t ".{left-of}"'
bind-key -r                   S-RIGHT            if -F '#{pane_at_right}'  ''  'move-pane -t ".{right-of}"'

# Unconditional of full-edge move using Shift-Alt-Arrows
bind-key -r   S-M-LEFT   if -F '#{pane_at_left}'   'move-pane -hf -b -t "{top}"'  'move-pane -h    -t ".{left-of}"'
bind-key -r   S-M-RIGHT  if -F '#{pane_at_right}'  'move-pane -hf -t "{top}"'     'move-pane -h -b -t ".{right-of}"'
bind-key -r   S-M-UP     if -F '#{pane_at_top}'    'move-pane -vf -b -t "{next}"' 'move-pane -v    -t ".{up-of}"'
bind-key -r   S-M-DOWN   if -F '#{pane_at_bottom}' 'move-pane -vf -t "{next}"'    'move-pane -v -b -t ".{down-of}"'

# Resize panes (standard tmux config)
# bind-key -r -T prefix         C-UP               resize-pane -U
# bind-key -r -T prefix         C-DOWN             resize-pane -D
# bind-key -r -T prefix         C-LEFT             resize-pane -L
# bind-key -r -T prefix         C-RIGHT            resize-pane -R

# Swap windows with prefix + C-M-LEFT/RIGHT
bind-key -r                   C-M-LEFT           swap-window -d -t :-1
bind-key -r                   C-M-RIGHT          swap-window -d -t :+1

# Swap panes with neighbors using Alt+Arrows (tmux ≥ 3.0)
bind-key -r                   M-LEFT             if -F '#{pane_at_left}'   '' 'run-shell "tmux swap-pane -t \"{left-of}\"  && tmux select-pane -t \"#{pane_id}\""'
bind-key -r                   M-RIGHT            if -F '#{pane_at_right}'  '' 'run-shell "tmux swap-pane -t \"{right-of}\" && tmux select-pane -t \"#{pane_id}\""'
bind-key -r                   M-UP               if -F '#{pane_at_top}'    '' 'run-shell "tmux swap-pane -t \"{up-of}\"    && tmux select-pane -t \"#{pane_id}\""'
bind-key -r                   M-DOWN             if -F '#{pane_at_bottom}' '' 'run-shell "tmux swap-pane -t \"{down-of}\"  && tmux select-pane -t \"#{pane_id}\""'

# Enter copy-mode with page-up, then scroll a page
# bind-key -T root            PageUp             copy-mode -e \; send-keys -X halfpage-up
# bind-key -T root            PageDown           copy-mode -e \; send-keys -X halfpage-down

# When already in copy-mode, just scroll a page
bind-key -T copy-mode         PageUp             send-keys -X halfpage-up
bind-key -T copy-mode         PageDown           send-keys -X halfpage-down

# Enter copy-mode and move to top of history buffer
# bind-key -T root            Home               copy-mode -e \; send-keys -X history-top

# Move to top of history buffer
bind-key -T copy-mode         Home               send-keys -X history-top

# End = quit copy-mode, back to normal tmux
# bind-key -T copy-mode       End                send-keys -X cancel

# Move to the bottom of history buffer
bind-key -T copy-mode         End                send-keys -X history-bottom

# Copy to clipboard (and exit copy-mode)
bind-key -T copy-mode MouseDragEnd1Pane  send-keys -X copy-selection-and-cancel
bind-key -T copy-mode C-w                send-keys -X copy-selection-and-cancel
bind-key -T copy-mode M-w                send-keys -X copy-selection-and-cancel

# Search the copy-mode buffer with n/p instead of n/N
# bind-key    -T copy-mode            p          send-keys -X search-reverse
# bind-key    -T copy-mode            n          send-keys -X search-again
# unbind-key  -T copy-mode            N

# Split panes in a more intuitive manner
bind-key    -T prefix           |                split-window -h -c "#{pane_current_path}"
bind-key    -T prefix           %                split-window -h -c "#{pane_current_path}"
bind-key    -T prefix           -                split-window -v -c "#{pane_current_path}"
bind-key    -T prefix           \"               split-window -v -c "#{pane_current_path}"

# Preserve current directory when creating new window/pane
bind-key    -T prefix           c                new-window -c "#{pane_current_path}"

# Create new windows and sessions
bind-key         -T prefix           C-s         command-prompt -p "Enter session name:" "new-session -s '%%'"
bind-key         -T prefix           C-w         command-prompt -p "Enter window name:" "new-window -n '%%'"

# Bind prefix + C-R to rename the current window, suggesting the old name
bind-key         -T prefix           M-w         command-prompt -I "#{window_name}" "rename-window '%%'"
bind-key         -T prefix           M-s         command-prompt -I "#{session_name}" "rename-session '%%'"

# Swap panes
bind-key         -T prefix           \{          swap-pane -U
bind-key         -T prefix           \}          swap-pane -D

# Bind F11 to toggle status bar
bind -n F11 if-shell '[ "$(tmux show -gv status)" = "off" ]' \
  'set -g status on' \
  'set -g status off'

# Kill pane without asking confirmation
bind-key         -T prefix           &             if-shell '[ "#{window_panes}" -eq 1 ] && [ "#{session_windows}" -eq 1 ]' {
    set-option -w automatic-rename on
    respawn-window -c "$HOME" -k
    detach-client
  } kill-window
bind-key         -T prefix           x            if-shell '[ "#{window_panes}" -eq 1 ] && [ "#{session_windows}" -eq 1 ]' {
    set-option -w automatic-rename on
    respawn-pane -c "$HOME" -k
    detach-client
  } kill-pane

# Clear screen and history
bind-key         -T prefix           k            send-keys C-l \; send-keys -R \; clear-history

# Change prefix only for SSH sessions
# if-shell '[ -n "$SSH_CONNECTION" ]' 'unbind C-b ; set -g prefix M-C-b ; bind M-C-b send-prefix'

# Start indexing windows and panes from 1; behavior of sessions cannot be changed
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Source .tmux.conf as suggested in `man tmux`
bind-key                             R            source-file "~/.config/tmux/tmux.conf" \; display-message "Sourced .tmux.conf completed"

# pressing CTRL-a sends the configured prefix to the terminal, and thus to the inner tmux sessions; non-prefixed binding with `-n`
# bind-key -n C-a send-prefix

# pressing CTRL-b-b sends the configured prefix to the terminal, and thus to the inner tmux sessions
bind-key b send-prefix

# Disable automatic synchronization of terminal titles with the window titles
# We avoid dealing with terminal titles in tmux
set-option -g set-titles off
# set-option -g set-titles-string "#S: #W"

# === tmux-fzf-links ===

set-option -g @fzf-links-key C-h
set-option -g @fzf-links-history-lines "0"

if-shell '[[ $OSTYPE = darwin* ]]' {
  # Darwin
  # set-option -g @fzf-links-editor-open-cmd "open vscode://file'%file':%line"
  # set-option -g @fzf-links-editor-open-cmd "$HOME/.local/bin/subl '%file':%line"
  set-option -g @fzf-links-editor-open-cmd "tmux new-window -n 'emacs' env PATH=/opt/homebrew/bin:$PATH ~/.local/bin/emacsclient -nw -c +%line '%file'"
  set-option -g @fzf-links-browser-open-cmd "open '%url'"
}{
  if-shell '[[ $OSTYPE = linux* ]]' {
    # Linux
    set-option -g @fzf-links-editor-open-cmd "tmux new-window -n 'emacs' /usr/bin/emacsclient -nw -c +%line '%file'"
    set-option -g @fzf-links-browser-open-cmd "xdg-open '%url'"  
  }
}
# set-option -g @fzf-links-browser-open-cmd "$HOME/.local/bin/firefox '%url'"
set-option -g @fzf-links-fzf-path "~/.local/share/zinit/polaris/bin/fzf"
set-option -g @fzf-links-fzf-display-options "-w 100% --maxnum-displayed 20 --multi --track --no-preview"
set-option -g @fzf-links-path-extension "$HOME/.local/share/zinit/polaris/bin"
set-option -g @fzf-links-python "~/.pyenv/versions/py313/bin/python"
set-option -g @fzf-links-python-path ""
set-option -g @fzf-links-user-schemes-path "~/.local/share/zinit/plugins/tmux-plugins---tmux-fzf-links/user_schemes/user_schemes.py"
set-option -g @fzf-links-loglevel-tmux "WARNING"
set-option -g @fzf-links-loglevel-file "DEBUG"
set-option -g @fzf-links-use-colors on
set-option -g @fzf-links-ls-colors-filename "~/.cache/vivid/ls_colors"
set-option -g @fzf-links-other-colors "color=test"
set-option -g @fzf-links-hide-bottom-bar "off"
# set-option -g @fzf-links-log-filename "~/tmux-fzf-links.log"

run-shell "~/.local/share/zinit/plugins/tmux-plugins---tmux-fzf-links/fzf-links.tmux"

