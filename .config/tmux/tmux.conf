# === tmux-jump ===

# Bind tmux-jump commands
set-option -g @jump-key 'j'

# keys will overlap with the word (default); alternative 'off_left'
set -g @jump-keys-position 'left'

run-shell "~/.local/share/zinit/plugins/tmux-plugins---tmux-jump/tmux-jump.tmux"

# === tmux-suspend ===

set-option -g @suspend_key 'F12'

set-option -g @suspend_suspended_options ""

# Configure default: tmux enabled
set-option -g @tmux_disabled "0"

# Configure hooks
set-option -g @suspend_on_resume_command "tmux set-option -g @tmux_disabled '0'\\;"
set-option -g @suspend_on_suspend_command "tmux set-option -g @tmux_disabled '1'\\;"

# Load tmux-suspend
run-shell "~/.local/share/zinit/plugins/tmux-plugins---tmux-suspend/suspend.tmux"

# Source theme
source "$HOME/.config/tmux/catppuccin.conf"

# Cursor Settings
# Set a default cursor style to avoid "lazy initialization" issues.
# Also switch cursor style while in copy-mode (hooks set at end of file so they
# override themes/plugins).
set-option -g cursor-style blinking-block

# copy-mode: steady block + more visible cursor colour
# normal: revert to global cursor-style/cursor-colour
set-hook -g after-copy-mode 'set-option -p cursor-style block'

