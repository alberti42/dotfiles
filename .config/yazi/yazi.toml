# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
# Manager layout by ratio: [parent, current, preview] panel widths
ratio          = [ 4, 6, 8 ]

# File sorting method (e.g. alphabetical, natural, size, mtime, ...)
sort_by        = "alphabetical"

# Sort case-sensitively (true = case-sensitive, false = case-insensitive)
sort_sensitive = false

# Display files in reverse order (true = reverse, false = normal)
sort_reverse     = false

# Display directories first (true = dirs first, false = normal order)
sort_dir_first = false

# Transliterate filenames for sorting (only for sort_by = "natural")
sort_translit  = false

# Line mode: show extra info on the right side of each file row (size/mtime/etc.)
linemode       = "my_default"

# Show hidden files
show_hidden    = false

# Show the symlink target path after the filename
show_symlink   = true

# Keep this many files above/below cursor when scrolling (large values center cursor)
scrolloff      = 5

# Enable mouse events that plugins can receive (empty = disable mouse)
mouse_events   = [ "click", "scroll" ]

# Terminal title format (placeholders: {cwd}; empty string disables auto title updates)
title_format   = "Yazi: {cwd}"

[preview]
# Wrap long lines in the code preview ("yes" or "no")
wrap            = "yes"

# Width of a tab character in spaces
tab_size        = 2

# Maximum preview width for images (clear cache to apply)
max_width       = 1600

# Maximum preview height for images (clear cache to apply)
max_height      = 3000

# Image cache directory (system cache by default; set absolute path to persist)
cache_dir       = ""

# Wait at least this many milliseconds before sending image preview data
image_delay     = 0

# Image downscaling filter (nearest/triangle/catmull-rom/lanczos3)
image_filter    = "triangle"

# Image quality for pre-caching (50-90; higher = better quality, slower, larger cache)
image_quality   = 75

# Ueberzug image scaling ratio (e.g. 0.5 reduces to half; 1 is normal)
ueberzug_scale  = 1

# Ueberzug image offset [x, y, width, height] in cell units (for size/position fixes)
ueberzug_offset = [ 0, 0, 0, 0 ]

[plugin]
# Prepend additional preview rules before the default previewers
# (Manual: previewers match by url/mime and run a Lua previewer plugin)

# You can prepend or append new preview rules to the default `previewers` under `[plugin]` by `prepend_previewers` and `append_previewers`,
# - `url` (String): Glob expression for matching the file URL. Case-insensitive by default, add `\s` to the beginning to make it sensitive.
# - `mime` (String): Glob expression for matching the mime-type. Case-insensitive by default, add `\s` to the beginning to make it sensitive.
# - `run` (String): The name of the Lua plugin to be run.
[[plugin.prepend_previewers]]
url = "*.backup.log"
run = 'faster-piper --rely-on-preloader'

[[plugin.prepend_preloaders]]
url = "*.backup.log"
run = 'faster-piper -- bat -p -n --color=always -- "$1"'

[[plugin.prepend_previewers]]
url = "*.md"
run = 'faster-piper --rely-on-preloader'

[[plugin.prepend_preloaders]]
url = "*.md"
run = 'faster-piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dracula -- "$1"'

[[plugin.prepend_previewers]]
url = "*.tar*"
run = 'faster-piper --format=url --rely-on-preloader'

[[plugin.prepend_preloaders]]
url = "*.tar*"
run = 'faster-piper -- tar tf "$1"'

[[plugin.prepend_previewers]]
url = "*.txt.gz"
run = 'faster-piper --rely-on-preloader'

[[plugin.prepend_preloaders]]
url = "*.txt.gz"
run = 'faster-piper -- gzip -dc "$1"'

[[plugin.prepend_fetchers]]
id  = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/"
run = "git"

