[[opener.reveal]]
run = "xdg-open %d1"
desc = "Reveal"
for = "linux"

[[opener.reveal]]
run = "open -R %s1"
desc = "Reveal"
for = "macos"

[[opener.reveal]]
run = "explorer /select,%s1"
desc = "Reveal"
for = "windows"
orphan = true

[[opener.reveal]]
run = "termux-open %d1"
desc = "Reveal"
for = "android"

[[opener.reveal]]
run = '''
if [ -n "${TMUX-}" ] && command -v tmux >/dev/null 2>&1; then
  MIN_WIDTH=80 &&
  MIN_HEIGHT=24 &&
  cw=$(tmux display -p "#{client_width}") &&
  ch=$(tmux display -p "#{client_height}") &&
  w=$(( (cw * 2 + 1) / 3 )) &&
  h=$(( (ch * 2 + 1) / 3 )) &&

  # clamp to minimum
  [ "$w" -ge "$MIN_WIDTH" ] || w="$MIN_WIDTH" &&
  [ "$h" -ge "$MIN_HEIGHT" ] || h="$MIN_HEIGHT" &&

  # clamp to client maximum (so popup never exceeds the terminal)
  [ "$w" -le "$cw" ] || w="$cw" &&
  [ "$h" -le "$ch" ] || h="$ch" &&

  tmux display-popup -E -w "$w" -h "$h" -T "EXIF" \
  sh -lc '
    exiftool -- "$1" | bat --color=always --plain -l exif --paging=always --pager="less -RX --tilde --clear-screen -Ps'' --mouse"
  ' -- %s1
else
  exiftool -- %s1 | bat --color=always --plain -l exif --paging=always --pager="less -RX --tilde --clear-screen -Ps'' --mouse";
fi
'''
desc = "Show EXIF"
for = "unix"
block = false
orphan = true

[tasks]
# Maximum number of concurrent micro-tasks
micro_workers    = 10

# Maximum number of concurrent macro-tasks
macro_workers    = 10

# Maximum number of retries when a bizarre failure occurs
bizarre_retry    = 3

# Maximum memory allocation for decoding a single image in bytes (0 = unlimited)
image_alloc      = 536870912  # 512MB

# Maximum image size [width, height] in pixels for decoding (0 = unlimited)
image_bound      = [ 10000, 10000 ]

# Hide preload tasks from task list, don't report progress, don't consider for exit confirm
suppress_preload = false

[input]
# Control cursor blinking in inputs (true = blink, false = no blink)
cursor_blink = false

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 15 ]

