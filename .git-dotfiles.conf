# Marker: bin/deploy_public.zsh checks dotfiles.included to confirm this file is included.
[dotfiles]
  included = true

[filter "gemini-theme"]
  clean = sed -E 's/^([[:space:]]*\"theme\")[[:space:]]*:[^,]*(,?)$/\\1: \"Default Light\"/'
  smudge = cat

[filter "claude"]
  clean = sed -E -e 's/^([[:space:]]*\"theme\")[[:space:]]*:[^,]*(,?)$/\\1: \"light-ansi\"\\2/' -e 's/^([[:space:]]*\"model\")[[:space:]]*:[^,]*(,?)$/\\1: \"opus[1m]\"\\2/'
  smudge = cat

[filter "pi-version"]
  clean = sed -E 's/^([[:space:]]*\"lastChangelogVersion\")[[:space:]]*:[^,]*(,?)$/\\1: \"0.85.0\"\\2/'
  smudge = cat

[filter "yazi-theme"]
  clean = sed -E 's/^(dark|light)[[:space:]]*=.*$/\\1 = \"catppuccin-latte\"/'
  smudge = cat

[filter "btop-conf"]
  clean = "sed -E -e 's/^(color_theme[[:space:]]*=[[:space:]]*\").*\"$/\\1catppuccin_latte\"/' -e 's/^(#\\? Config file for btop v\\.).*$/\\11.4.6/' -e 's/^(proc_sorting[[:space:]]*=[[:space:]]*\").*\"$/\\1memory\"/'"
  smudge = cat

[filter "patina-theme"]
  clean = sed -E 's/^([[:space:]]*theme[[:space:]]*=[[:space:]]*).*$/\\1\"classic\"/'
  smudge = cat

[filter "ipython-theme"]
  clean = sed -E \"s/^[[:space:]]*c\\.InteractiveShell\\.colors[[:space:]]*=.*$/c.InteractiveShell.colors = 'lightbg'/\" | sed -E \"s/^[[:space:]]*c\\.TerminalInteractiveShell\\.colors[[:space:]]*=.*$/c.TerminalInteractiveShell.colors = 'lightbg'/\"
  smudge = cat

[filter "typingmind_mcp"]
  clean = "bin/sed_require.zsh %f '/<key>MCP_AUTH_TOKEN<\\/key>/ { N; s#(<key>MCP_AUTH_TOKEN</key>[[:space:]]*<string>)[^<]*(</string>)#\\1SECRET_PASSWORD\\2#; }'"
  smudge = cat
  required = true

[filter "sublime-merge-draw-white-space"]
  clean = sed -E 's/^([[:space:]]*\"draw_white_space\")[[:space:]]*:[^,]*(,?)$/\\1: \"all\"\\2/'
  smudge = cat

[filter "sublime-merge-ignore-diff-white-space"]
  clean = sed -E 's/^([[:space:]]*\"ignore_diff_white_space\")[[:space:]]*:[^,]*(,?)$/\\1: false\\2/'
  smudge = cat

[filter "sublime-preferences"]
  clean = sed -E 's|^([[:space:]]*\"dictionary\")[[:space:]]*:[^,]*(,?)$|\\1: \"Packages/Dictionaries/English (American).dic\"\\2|'
  smudge = cat

[filter "sublime-ltex"]
  clean = bin/sed_require.zsh %f 's/^([[:space:]]*\"ltex\\.languageToolOrg\\.username\")[[:space:]]*:[^,]*(,?)$/\\1: \"...\"\\2/' 's/^([[:space:]]*\"ltex\\.ltex-ls\\.languageToolOrgApiKey\")[[:space:]]*:[^,]*(,?)$/\\1: \"...\"\\2/'
  smudge = cat
  required = true

[filter "sublime-sftp"]
  clean = bin/sed_require.zsh %f 's/^([[:space:]]*\"product_key\")[[:space:]]*:[^,]*(,?)$/\\1: \"...\"\\2/'
  smudge = cat
  required = true

[filter "vscode"]
  clean = bin/sed_require.zsh %f 's/^([[:space:]]*\"ltex\\.languageToolOrg\\.username\")[[:space:]]*:[^,]*(,?)$/\\1: \"...\"\\2/' 's/^([[:space:]]*\"ltex\\.languageToolOrg\\.apiKey\")[[:space:]]*:[^,]*(,?)$/\\1: \"...\"\\2/'
  smudge = cat
  required = true

[core]
  hooksPath = git-hooks

[remote "public-origin"]
  url = https://github.com/alberti42/dotfiles
  fetch = +refs/heads/*:refs/remotes/public-origin/*
