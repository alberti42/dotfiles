# DKMS package: amdgpu with the s2idle resume fix (see README.md).
PACKAGE_NAME="amdgpu-s2idle"
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="amdgpu"
BUILT_MODULE_LOCATION[0]="src/drivers/gpu/drm/amd/amdgpu"
# Required, although DKMS 3 ignores the value and always installs under
# /lib/modules/<kernel>/extra/; it moves the in-tree module aside until uninstall.
DEST_MODULE_LOCATION[0]="/extra"

# Fetches and patches the kernel's own amdgpu source into src/.
PRE_BUILD="prepare-source.sh ${kernelver}"

# DKMS adds -j and KERNELRELEASE; it strips and compresses the module and
# deletes the build directory (about 3 GB) after the build.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/drivers/gpu/drm/amd/amdgpu KCFLAGS=-I${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/include/trace modules"

AUTOINSTALL="yes"
