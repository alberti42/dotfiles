# DKMS package: hid-magicmouse with scroll_motion_block_ms (see README.md).
PACKAGE_NAME="hid-magicmouse-motion"
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="hid-magicmouse"
BUILT_MODULE_LOCATION[0]="src"
# Required, although DKMS 3 ignores the value and always installs under
# /lib/modules/<kernel>/extra/; it moves the in-tree module aside until uninstall.
DEST_MODULE_LOCATION[0]="/extra"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src modules"

AUTOINSTALL="yes"
