# /etc/modprobe.d/hid-magicmouse.conf (see dkms/hid-magicmouse/README.md)
#
# Ignore Magic Mouse scrolling while the mouse moves, and for 150 ms after.
# The mouse counts as moving above 10 counts per report: with fingers resting
# on the mouse, most reports move it by 10 counts or less, which blocked
# scrolling at 2.
# A touch on the left half makes a left click (right hand; 2 for the left hand).
# After a fast scroll, keep scrolling and slow down with a 175 ms time constant.
# All values can also be changed at runtime in
# /sys/module/hid_magicmouse/parameters/.
options hid_magicmouse scroll_motion_block_ms=150 scroll_motion_threshold=10 click_priority_side=1 scroll_momentum_ms=175
