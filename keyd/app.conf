# ~/.config/keyd/app.conf — read by keyd-application-mapper.
#
# A section applies while a window of that class has focus. The class is the
# Wayland app id, lowercased, with each run of characters other than letters
# and digits replaced by "-": org.gnome.TextEditor -> org-gnome-texteditor.
# `keyd-application-mapper -v` prints the class of each window that gets focus.
#
# A binding emits its key without the modifier of the layer it is in:
# control.a = home sends Home, not Ctrl+Home. Shift is kept, so Shift+C-a
# selects to the start of the line.

# GNOME Text Editor is a GTK 4 app and ignores the GTK key theme
# (org.gnome.desktop.interface gtk-key-theme 'Emacs').
[org-gnome-texteditor]

# Lines and characters. These replace Text Editor's own shortcuts on the same
# keys, among them C-a select all and C-f find.
control.a = home
control.e = end
control.f = right
control.b = left
control.n = down
control.p = up
control.d = delete

# Kill to the end of the line into the clipboard, and yank, like
# ~/Library/KeyBindings/DefaultKeyBinding.dict on macOS.
# At the end of a line C-k cuts nothing; it does not join the next line.
control.k = macro(S-end C-x)
control.y = C-v
alt.w = C-c
control.slash = C-z

# Words.
alt.f = C-right
alt.b = C-left
alt.d = C-delete
alt.backspace = C-backspace

# keyd binds the left Alt key to the alt layer and the right Alt key to the
# altgr layer, so each Meta binding is repeated for the right Option key.
altgr.w = C-c
altgr.f = C-right
altgr.b = C-left
altgr.d = C-delete
altgr.backspace = C-backspace

# Not bound, to keep paste (C-v) and close tab (C-w):
# control.v = pagedown
# alt.v = pageup
# control.w = C-x
