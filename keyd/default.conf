# /etc/keyd/default.conf — copied from ~/.config/dotfiles/keyd/default.conf.
# Not a symlink: keyd runs as root and runs command(...) actions as root, so a
# link to a file the user owns would let any user process gain root.
#
# keyd grabs every keyboard and passes all keys through unchanged. The
# Emacs bindings are in app.conf; keyd-application-mapper applies them only
# while GNOME Text Editor has focus.

[ids]
*

