# Symlinks from $HOME into this repo, read by bin/links.zsh.
#
#   <os>  <link, relative to $HOME>  ->  <target, relative to the repo>
#
# <os> is all, macos or linux. Alternative targets are separated by " | ":
# `install` links the first, `check` accepts any (for links switched at runtime).
#
#   ignore  <path, relative to $HOME>
#
# `check` skips links at or under an ignored path, and does not descend into it.
# ~/.config/dotfiles itself is created by `install` and is not listed here.

#--- shell -------------------------------------------------------------------
all    .zshenv                                       -> zsh/.zshenv
all    .zshrc                                        -> zsh/.zshrc
all    .p10k.zsh                                     -> zsh/.p10k.zsh

